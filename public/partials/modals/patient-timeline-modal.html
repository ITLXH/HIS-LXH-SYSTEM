<!-- Patient Timeline Modal -->
<div class="modal fade" id="patientTimelineModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable patient-timeline-dialog">
    <div class="modal-content patient-timeline-modal-content">
      <div class="modal-header patient-timeline-header">
        <div class="d-flex align-items-center gap-2">
          <span class="patient-timeline-title-icon" aria-hidden="true"><i class="fas fa-notes-medical"></i></span>
          <div>
            <h5 class="modal-title">ແຟ້ມປະຫວັດຄົນເຈັບ</h5>
            <div class="patient-timeline-subtitle">Patient Clinical Record</div>
          </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body patient-timeline-body">
        <div class="patient-timeline-layout">
          <!-- Patient identity -->
          <section class="patient-record-header" aria-label="Patient information">
            <div id="timeline_p_photo_wrapper" class="patient-record-photo">
              <img id="timeline_p_photo" src="" alt="Patient photo" onerror="this.style.display='none'; document.getElementById('timeline_p_placeholder').style.display='block';">
              <i class="fas fa-user" id="timeline_p_placeholder" aria-hidden="true"></i>
            </div>
            <div class="patient-record-identity">
              <span class="patient-record-label">ຂໍ້ມູນຄົນເຈັບ</span>
              <h5 id="timeline_p_name">-</h5>
              <div class="patient-record-meta">
                <span><b>HN</b><span id="timeline_p_id">-</span></span>
                <span id="timeline_p_info">-</span>
              </div>
              <div class="patient-record-source">ປະຫວັດລວມຈາກ OPD, IPD, ຫ້ອງກວດ ແລະ ຫ້ອງຢາ</div>
            </div>
          </section>

          <!-- Clinical record timeline -->
          <div class="timeline-container">
            <div id="timelineContent">
              <div class="his-data-loader" role="status" aria-live="polite"><span class="his-data-loader__logo-shell" aria-hidden="true"><img class="his-data-loader__logo" src="/luckxay-logo.jpg" alt=""></span><span class="his-data-loader__copy"><strong>ກຳລັງໂຫລດຂໍ້ມູນ</strong></span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer patient-timeline-footer">
        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">ປິດ</button>
      </div>
    </div>
  </div>
</div>
