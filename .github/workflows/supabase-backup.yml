name: Supabase DB Backup
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply verified obsolete snapshot cleanup
      expected_plan:
        type: string
        default: ''
        description: Exact plan SHA-256 from audit
permissions:
  contents: read
concurrency:
  group: supabase-database-backup
  cancel-in-progress: false
jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate retained backups and audit bounded cleanup
        run: python -u backup/scripts/storage_cleanup_audit.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET || 'his-backups' }}
          CLEANUP_APPLY: ${{ inputs.apply }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-cleanup-report
          path: storage-cleanup-report.json
          retention-days: 7
