name: HIS login layout CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/login-card-center-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-layout-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Login CSS layout regression
        run: node scripts/test-login-center-layout.mjs
      - name: Auth and clinical notification boundary regression
        run: |
          npm run test:auth
          npm run test:auth-session
          npm run test:security
          node scripts/test-notification-auth-boundary.mjs
      - run: npm run build
