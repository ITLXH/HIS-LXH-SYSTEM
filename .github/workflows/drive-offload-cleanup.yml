name: Supabase Drive Offload Cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Remove Drive-verified sidecars from Supabase backup storage
      expected_plan:
        type: string
        default: ''
        description: Exact plan SHA-256 from the latest audit

permissions:
  contents: read

concurrency:
  group: supabase-drive-offload-cleanup
  cancel-in-progress: false

jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests google-api-python-client google-auth
      - name: Validate Google Drive copies and audit bounded cleanup
        run: python -u backup/scripts/drive_offload_cleanup.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET || 'his-backups' }}
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CLEANUP_APPLY: ${{ inputs.apply }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-offload-cleanup-report
          path: drive-offload-cleanup-report.json
          retention-days: 7
